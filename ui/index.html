<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>MidiDrift</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #01121f;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #app {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      #pixi-bg,
      #react-root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #pixi-bg {
        z-index: 0;
        pointer-events: none;
      }
      #react-root {
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="pixi-bg"></div>
      <div id="react-root"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
