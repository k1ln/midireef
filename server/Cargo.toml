[package]
name = "midireef-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
tower-http = { version = "0.5", features = ["fs"] }
# rustls statt native-tls/OpenSSL: der Server wird für aarch64 gegen einen
# Cross-Container gebaut (deploy/build-server.sh) — dort ist kein System-
# OpenSSL für das Zielarchitektur vorhanden, rustls braucht keins.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "0.9"
core-foundation = "0.10"

[[bin]]
name = "midireef-server"
path = "src/main.rs"
